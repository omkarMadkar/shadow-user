name: shadow_sentinel
description: "Shadow Sentinel - Zero Trust Continuous Authentication Platform"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  ffi: ^2.1.3
  fl_chart: ^0.69.2
  intl: ^0.19.0
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1
  record: ^5.2.1
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  ffigen: ^14.0.1
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

# record_linux 0.7.2 is incompatible with the latest record_platform_interface.
# We only target Windows, so override it to avoid compile errors.
dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
